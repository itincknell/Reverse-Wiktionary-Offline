services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - /mnt/reverse-wiktionary/qdrant/storage:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - /mnt/reverse-wiktionary/redis/data:/data
    expose:
      - "6379"
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    environment:
      APP_ENV: production
      COLLECTION_NAME: ${COLLECTION_NAME:-reverse_wiktionary_v1}
      MODEL_NAME: ${MODEL_NAME:-sentence-transformers/all-mpnet-base-v2}
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LIMIT: ${DEFAULT_LIMIT:-25}
      MAX_LIMIT: ${MAX_LIMIT:-100}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SECURE_COOKIES: "true"
    expose:
      - "8000"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/reverse-wiktionary/logs/nginx:/var/log/nginx
    depends_on:
      - web
    restart: unless-stopped

